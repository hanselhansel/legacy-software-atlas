# Jev spend caps in USD of TypeSafe credit. Target: under $25 total (spec section 7).
# account_total is enforced across every pass together.
# Only Hansel sets account_total, at the pre-Jev gate (plan 1, task 5). Until then
# it stays 0.00 and no paid call is allowed.

account_total = 8.00   # Hansel 2026-10-05: loaded $10 of credit, approved running; $2 kept unspent

# Worst-case billed input tokens for an attempt whose usage never arrives
# (timeout or 5xx). Unknown charges settle at max(this, 2 x estimated tokens).
worst_case_tokens_per_unknown_attempt = 4000

# Per-pass caps, keyed by the pass slug (the pass name lowercased, non-alnum
# runs collapsed to '-'). A pass with no entry, or 0.00, may not spend.
# Only Hansel sets these.
[caps]
"tenders-legacy-system-in-use-being-replaced-or-neither" = 0.30
"tenders-which-category" = 0.30
"job-apis-industry-segment-legacy-in-use" = 0.20
"job-pages-industry-segment-legacy-in-use" = 0.10   # lowered 2026-10-05: spent $0.02
"vendor-stories-category-in-use-or-replaced-segment-region" = 0.10   # lowered 2026-10-05: spent $0.04
"si-stories-category-in-use-or-replaced-segment-region" = 0.20
"hn-firsthand-pain-and-reason-to-stay" = 0.15
"tasks-ai-fit" = 0.05
"awards-keep-alive-or-replace" = 1.50
"app-reviews-backend-failure" = 1.50
"yc-category" = 0.30
# Caps are about 2.5x each pass's estimate in docs/reports/2026-10-05-pre-jev.md.
# Unallocated reserve for pilots, the audit replay and reruns: 8.00 - 5.55 = 2.45.
