# Five-part score rubric (spec section 8). Each part is 1 to 5. Lock-in and crowding are
# penalties: the opportunity total is size + pain + ai_fit - lockin - crowding, then rescaled
# to 0..100 for display. Default weights are equal; readers re-weight on the site.

[weights]
size = 1.0
pain = 1.0
ai_fit = 1.0
lockin = 1.0
crowding = 1.0

[size]
# Market value: buyer-universe buyers x per-segment annual spend
# (research/criticality.csv). Binned on the value midpoint in USD.
evidence = "buyer universe x criticality spend; falls back to buyer count when no spend"
value_bins_usd = [100_000_000, 1_000_000_000, 5_000_000_000, 20_000_000_000]  # <$0.1B -> 1 ... >=$20B -> 5
# Fallback when a category has no spend data: bin the buyer-count midpoint.
buyer_bins = [100, 1000, 10000, 100000]   # <100 -> 1, <1k -> 2, <10k -> 3, <100k -> 4, else 5

[pain]
# Mean of sub-scores, each ranked across categories into quintiles 1..5.
# A sub-score with no data or below its minimum count stays out of the mean.
evidence = "award keep-alive share, app-review backend failures, app ratings, failed replacement rate, s3 grade"
min_awards = 10          # keep_alive_share needs this many categorized awards
min_reviews = 50         # backend_failure_share needs this many answered reviews
min_apps = 3             # app_rating_inverted needs this many rated apps
min_cases = 3            # failed_rate needs this many replacement cases
failure_yes = 0.7        # a review answer at p >= this counts as backend failure
s3_strong = 5            # direct sub-score for s3 grade strong
s3_weak = 3              # direct sub-score for s3 grade weak
s3_other = 1             # direct sub-score for any other s3 grade

[ai_fit]
# Mean Jev score (1 to 5) over the category's task list, weighted by time share
# (high 3, medium 2, low 1), rounded to the nearest integer.
evidence = "jev pass 'tasks: ai fit' over research/tasks.csv"
share_weights = { high = 3, medium = 2, low = 1 }

[lockin]
# Mean of sub-scores, each ranked into quintiles 1..5 like pain.
evidence = "award duration, non-competitive award share, replacement duration, regulator approval"
min_awards = 10          # award duration and non-competitive share need this many categorized awards
min_cases = 3            # replacement duration needs this many replacement cases
noncompetitive = ["negotiated_no_competition", "direct"]
regulator_true = 5       # direct sub-score when regulator approval is required
regulator_false = 1      # direct sub-score when it is not

[crowding]
# Mean of sub-scores ranked into quintiles 1..5 like pain.
evidence = "AI-native challengers at traction, 24-month AI-native funding per $1B of legacy spend, YC 2024+ companies"
traction_status = "traction"
