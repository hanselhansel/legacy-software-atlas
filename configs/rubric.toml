# Five-part score rubric (spec section 8). Each part is 1 to 5. Lock-in and crowding are
# penalties: the opportunity total is size + pain + ai_fit - lockin - crowding, then rescaled
# to 0..100 for display. Default weights are equal; readers re-weight on the site.

[weights]
size = 1.0
pain = 1.0
ai_fit = 1.0
lockin = 1.0
crowding = 1.0

[size]
# Midpoint of the "companies using" range summed over all regions.
evidence = "estimates: companies_using low/high per category"
bins = [100, 1000, 10000, 100000]   # <100 -> 1, <1k -> 2, <10k -> 3, <100k -> 4, else 5

[pain]
# Start at 1 and add points, capped at 5.
evidence = "S3 grade, HN firsthand pain (p >= 0.7), job posts showing the legacy system in use"
s3_strong = 2
s3_weak = 1
hn_pain_min_comments = 5        # +1 when at least this many firsthand-pain comments
legacy_in_use_share = 0.30      # +1 when at least this share of the category's labelled job posts show it in use

[ai_fit]
# Mean Jev score (1 to 5) over the category's task list, weighted by time share
# (high 3, medium 2, low 1), rounded to the nearest integer.
evidence = "jev pass 'tasks: ai fit' over research/tasks.csv"
share_weights = { high = 3, medium = 2, low = 1 }

[lockin]
# Start at 1 and add points, capped at 5.
evidence = "S2 grade, S4 grade, reasons to stay"
s2_strong = 2
s2_weak = 1
s4_strong = 1
regulation_reason = 1           # +1 when research lists regulation or certification as a reason to stay

[crowding]
# From research/challengers.csv for the category.
evidence = "count and disclosed funding of AI-native or modern challengers"
count_bins = [2, 5, 9]          # <2 -> 1, <5 -> 2, <9 -> 3, else 4
funding_usd_over = 500_000_000  # +1 when disclosed challenger funding sums above this
