# Jev question sets, one per [[pass]] in configs/passes.toml, keyed by pass name.
# Types: "choice" (criteria is an option -> description table),
#        "score" (criteria is an ordered rubric list),
#        "probability" (no criteria; the answer is a 0..1 probability, sent to
#                       TypeSafe as its "noul" wire type).
# Instructions refer to the item's text window as `item`. A packed call sends
# items_per_call items at once and rewrites `item` to the slot key i1, i2, ...
# (spec section 7; plan 2, task 2). Choice lists come from spec sections 1 and 7:
# categories are the 35 kept rows of research/categories.csv, segments are spec
# question 5, reasons to stay are spec question 4, regions are spec section 4
# plus "other" and "unclear" fallbacks.

["tenders: legacy system in use, being replaced, or neither"]
version = 1

["tenders: legacy system in use, being replaced, or neither".questions.system_status]
type = "choice"
instructions = "`item` is a tender or contract notice. Does it name a legacy system as currently in use, as being replaced, or neither?"

["tenders: legacy system in use, being replaced, or neither".questions.system_status.criteria]
in_use = "A legacy system is named as in use or being kept (for example extended, maintained or re-procured as-is)."
being_replaced = "A legacy system is named and is being replaced, migrated, retired or modernised."
neither = "No legacy system is named, or the notice is not about a system in use."

