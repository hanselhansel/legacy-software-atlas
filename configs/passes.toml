# Jev passes for the pre-Jev gate (plan 1, task 4). One entry per question per family.
# tokens_per_item is the text WINDOW sent to Jev, not the full page: titles plus the first
# N words that mention the matched system. Vendor stories were measured at 705 tokens per
# page and job pages at 2,318 (30-page samples); both are cut to the window below.
# Counts are per query, so items matching several queries are counted more than once:
# every figure here is an upper bound.

